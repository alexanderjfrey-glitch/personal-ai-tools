<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Personal AI Tools — V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:24px 16px 100px}.eyebrow{font-size:12px;color:#8b95a5;letter-spacing:.08em}.title{font-size:32px;font-weight:800;margin-top:4px}.sub{color:#8b95a5;margin:6px 0 22px}.card{background:#151b23;border:1px solid #252d38;border-radius:18px;padding:16px;margin:14px 0}button,input,select{font:inherit}button{cursor:pointer}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:#f3f4f6;color:#111827;font-weight:750}.add{display:flex;gap:8px}.add input{flex:1}.add button{width:52px;border:0;border-radius:13px;background:#f3f4f6;color:#111827;font-size:24px}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #252d38}.task:last-child{border-bottom:0}.check{width:24px;height:24px;border:2px solid #667085;border-radius:7px;background:transparent}.done .text{text-decoration:line-through;color:#7f8998}.empty{color:#8b95a5}.stats{display:flex;gap:10px}.stat{flex:1;background:#1b222c;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#8b95a5}.notice{font-size:13px;color:#8b95a5;line-height:1.5}.footer{color:#596273;font-size:11px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main class="app">
<div class="eyebrow">PERSONAL AI TOOLS</div>
<div class="title">Command Center</div>
<p class="sub">V1 — simple, stable, and built one piece at a time.</p>

<section class="card">
<h2>Today</h2>
<div class="stats"><div class="stat"><b id="openCount">0</b><span>Open</span></div><div class="stat"><b id="doneCount">0</b><span>Completed</span></div></div>
</section>

<section class="card">
<h2>Tasks</h2>
<div class="add"><input id="taskInput" placeholder="Add a task…" autocomplete="off"><button id="addBtn" aria-label="Add task">+</button></div>
<div id="taskList" style="margin-top:10px"></div>
</section>

<section class="card">
<h2>Next</h2>
<p class="notice">Once this task system is working reliably, we'll add the AI assistant. Gmail and the other integrations come after that.</p>
<button class="primary" id="testBtn">Test the app</button>
<p id="testResult" class="notice" style="margin-bottom:0"></p>
</section>

<div class="footer">V1 Clean Build</div>
</main>
<script>
(function(){
  'use strict';
  const STORAGE_KEY='personal_ai_tools_v1_tasks';
  const input=document.getElementById('taskInput');
  const addBtn=document.getElementById('addBtn');
  const list=document.getElementById('taskList');
  const openCount=document.getElementById('openCount');
  const doneCount=document.getElementById('doneCount');
  const testBtn=document.getElementById('testBtn');
  const testResult=document.getElementById('testResult');
  let tasks=[];
  try{tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}

  function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}
  function render(){
    const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
    openCount.textContent=open.length;doneCount.textContent=done.length;
    if(!tasks.length){list.innerHTML='<p class="empty">No tasks yet. Add your first one above.</p>';return}
    list.innerHTML=tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><button class="check" data-id="'+t.id+'" aria-label="Complete task"></button><div class="text">'+escapeHtml(t.text)+'</div></div>').join('');
  }
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function addTask(){const text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text:text,done:false});save();input.value='';render();input.focus()}
  addBtn.addEventListener('click',addTask);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')addTask()});
  list.addEventListener('click',function(e){const btn=e.target.closest('.check');if(!btn)return;const task=tasks.find(t=>String(t.id)===btn.dataset.id);if(!task)return;task.done=!task.done;save();render()});
  testBtn.addEventListener('click',function(){testResult.textContent='✓ The app JavaScript is running correctly on this device.'});
  render();
})();
</script>
</body>
</html>
