<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>Personal AI Tools — V1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0b0b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #202020}.brand{font-weight:700}.menu{width:40px;height:40px;border:0;background:transparent;color:#aaa;font-size:23px}.chat{flex:1;overflow-y:auto;padding:24px 18px 150px}.welcome{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center}.welcome h1{font-size:30px;margin:0 0 10px}.welcome p{color:#888}.messages{max-width:760px;margin:auto}.message{display:flex;margin:18px 0}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap}.assistant .bubble{padding-left:2px;color:#e8e8e8}.user .bubble{background:#242424}.composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0b0b 22%);pointer-events:none}.composer{max-width:760px;margin:auto;background:#1b1b1b;border:1px solid #303030;border-radius:25px;display:flex;align-items:flex-end;padding:7px;pointer-events:auto}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:9px 10px;font:inherit;max-height:130px}.send{width:38px;height:38px;border:0;border-radius:50%;background:#f2f2f2;color:#111;font-size:19px}.send:disabled{opacity:.35}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:5}.drawer.open{display:block}.panel{position:absolute;top:0;bottom:0;left:0;width:min(330px,88vw);background:#111;border-right:1px solid #292929;padding:18px;overflow:auto}.panel-head{display:flex;justify-content:space-between}.close{border:0;background:transparent;color:#aaa;font-size:25px}.task-add{display:flex;gap:7px}.task-add input{flex:1;background:#1b1b1b;border:1px solid #303030;color:#fff;border-radius:10px;padding:10px}.task-add button{width:42px;border:0;border-radius:10px}.task{display:flex;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #242424}.check{width:22px;height:22px;border:1px solid #666;border-radius:6px;background:transparent}.done .text{text-decoration:line-through;color:#777}.empty,.status{color:#777;font-size:14px}.status{margin-top:12px}.google{margin:18px 0 6px;padding-top:16px;border-top:1px solid #242424}.google button{width:100%;padding:11px;border:1px solid #3a3a3a;border-radius:10px;background:#f2f2f2;color:#111;font-weight:600}.google .status{margin:8px 0 0}</style></head><body><main class="app"><header class="top"><button class="menu" id="menuBtn">☰</button><div class="brand">Personal AI</div><div style="width:40px"></div></header><section class="chat" id="chat"><div class="messages" id="messages"><div class="welcome" id="welcome"><div><h1>How can I help?</h1><p>Your personal AI command center.</p></div></div></div></section><div class="composer-wrap"><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Message your assistant…"></textarea><button class="send" id="sendBtn" type="submit">↑</button></form></div></main><div class="drawer" id="drawer"><aside class="panel"><div class="panel-head"><strong>Command Center</strong><button class="close" id="closeBtn">×</button></div><h2>Tasks</h2><div class="task-add"><input id="taskInput" placeholder="Add a task…"><button id="addBtn">+</button></div><div id="taskList"></div><div class="google"><strong>Gmail</strong><button id="googleBtn" type="button">Connect Gmail</button><div class="status" id="googleStatus">Loading Google sign-in…</div></div></aside></div><script src="/google-auth.js" defer></script><script>(function(){'use strict';const K='personal_ai_tools_v1_tasks';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(K)||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){}const drawer=document.getElementById('drawer'),taskInput=document.getElementById('taskInput'),taskList=document.getElementById('taskList'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn');function save(){localStorage.setItem(K,JSON.stringify(tasks))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){taskList.innerHTML=tasks.length?tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><button class="check" data-id="'+t.id+'"></button><div class="text">'+esc(t.text)+'</div></div>').join(''):'<p class="empty">No tasks yet.</p>'}function addTask(text){text=String(text||'').trim();if(!text)return;tasks.unshift({id:String(Date.now()+tasks.length),text,done:false});save();render()}document.getElementById('menuBtn').onclick=()=>{drawer.classList.add('open');render()};document.getElementById('closeBtn').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.getElementById('addBtn').onclick=()=>{addTask(taskInput.value);taskInput.value='';taskInput.focus()};taskInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addBtn').click()}};taskList.onclick=e=>{const b=e.target.closest('.check');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.id);if(t){t.done=!t.done;save();render()}};function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';sendBtn.disabled=!input.value.trim()}input.oninput=resize;function msg(text,type){welcome.style.display='none';const row=document.createElement('div'),b=document.createElement('div');row.className='message '+type;b.className='bubble';b.textContent=text;row.appendChild(b);messages.appendChild(row);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight}async function send(text){msg(text,'user');const loading=document.createElement('div');loading.className='message assistant';loading.innerHTML='<div class="bubble">Thinking…</div>';messages.appendChild(loading);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...messages.querySelectorAll('.message')].map(x=>({role:x.classList.contains('user')?'user':'assistant',content:x.querySelector('.bubble').textContent})),tasks,googleAccessToken:window.googleAccessToken||''})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');loading.remove();(d.actions||[]).forEach(a=>{if(a.type==='add_task')addTask(a.task.text);if(a.type==='complete_task'){const t=tasks.find(x=>String(x.id)===String(a.task_id));if(t){t.done=a.done;save();render()}}});msg(d.text||'Done.','assistant')}catch(e){loading.remove();msg('I hit an error connecting to the agent: '+e.message,'assistant')}}document.getElementById('composer').onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';resize();send(text)};resize();render()})();</script></body></html>
