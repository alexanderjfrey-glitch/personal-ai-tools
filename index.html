<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>Personal AI Tools — V1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0b0b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #202020;flex:0 0 auto}.brand{font-weight:700;font-size:16px}.menu{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#aaa;font-size:23px}.menu:active{background:#191919}.chat{flex:1;overflow-y:auto;padding:24px 18px 150px}.welcome{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center}.welcome h1{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:750}.welcome p{margin:0;color:#888;font-size:15px}.messages{max-width:760px;margin:auto}.message{display:flex;margin:18px 0}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap}.assistant .bubble{padding-left:2px;padding-right:2px;color:#e8e8e8}.user .bubble{background:#242424;color:#fff}.composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0b0b 22%);pointer-events:none}.composer{max-width:760px;margin:auto;background:#1b1b1b;border:1px solid #303030;border-radius:25px;min-height:52px;display:flex;align-items:flex-end;padding:7px;box-shadow:0 8px 35px rgba(0,0,0,.4);pointer-events:auto}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#f5f5f5;padding:9px 10px;font:inherit;line-height:1.35;max-height:130px}.composer textarea::placeholder{color:#777}.send{width:38px;height:38px;border:0;border-radius:50%;background:#f2f2f2;color:#111;font-size:19px;font-weight:700;flex:0 0 auto}.send:disabled{opacity:.35}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:5}.drawer.open{display:block}.panel{position:absolute;top:0;bottom:0;left:0;width:min(330px,88vw);background:#111;border-right:1px solid #292929;padding:18px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;color:#aaa;font-size:25px}.panel h2{font-size:18px}.task-add{display:flex;gap:7px}.task-add input{min-width:0;flex:1;background:#1b1b1b;border:1px solid #303030;color:#fff;border-radius:10px;padding:10px}.task-add button{width:42px;border:0;border-radius:10px;background:#f2f2f2;color:#111;font-size:20px}.task{display:flex;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #242424}.check{width:22px;height:22px;border:1px solid #666;border-radius:6px;background:transparent;flex:0 0 auto}.done .text{text-decoration:line-through;color:#777}.empty{color:#777;font-size:14px}.test{margin-top:24px;color:#777;font-size:12px}.test button{margin-top:8px;width:100%;padding:11px;border:1px solid #333;background:#181818;color:#ddd;border-radius:10px}.test-result{margin-top:8px}</style></head><body><main class="app"><header class="top"><button class="menu" id="menuBtn" aria-label="Open menu">☰</button><div class="brand">Personal AI</div><div style="width:40px"></div></header><section class="chat" id="chat"><div class="messages" id="messages"><div class="welcome" id="welcome"><div><h1>How can I help?</h1><p>Your personal AI command center.</p></div></div></div></section><div class="composer-wrap"><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Message your assistant…" autocomplete="off"></textarea><button class="send" id="sendBtn" type="submit" aria-label="Send">↑</button></form></div></main><div class="drawer" id="drawer"><aside class="panel"><div class="panel-head"><strong>Command Center</strong><button class="close" id="closeBtn" aria-label="Close menu">×</button></div><h2>Tasks</h2><div class="task-add"><input id="taskInput" placeholder="Add a task…" autocomplete="off"><button id="addBtn" aria-label="Add task">+</button></div><div id="taskList"></div><div class="test"><div>V1 system test</div><button id="testBtn">Test the app</button><div class="test-result" id="testResult"></div></div></aside></div><script>(function(){'use strict';const K='personal_ai_tools_v1_tasks',drawer=document.getElementById('drawer'),taskInput=document.getElementById('taskInput'),taskList=document.getElementById('taskList'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn');let tasks=[];try{tasks=JSON.parse(localStorage.getItem(K)||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){}function save(){localStorage.setItem(K,JSON.stringify(tasks))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){taskList.innerHTML=tasks.length?tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><button class="check" data-id="'+t.id+'"></button><div class="text">'+esc(t.text)+'</div></div>').join(''):'<p class="empty">No tasks yet.</p>'}function addTask(){let text=taskInput.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text,done:false});save();taskInput.value='';render();taskInput.focus()}document.getElementById('menuBtn').onclick=()=>{drawer.classList.add('open');render()};document.getElementById('closeBtn').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.getElementById('addBtn').onclick=addTask;taskInput.onkeydown=e=>{if(e.key==='Enter')addTask()};taskList.onclick=e=>{let b=e.target.closest('.check');if(!b)return;let t=tasks.find(x=>String(x.id)===b.dataset.id);if(t){t.done=!t.done;save();render()}};document.getElementById('testBtn').onclick=()=>document.getElementById('testResult').textContent='✓ JavaScript is running correctly.';function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';sendBtn.disabled=!input.value.trim()}input.oninput=resize;function msg(text,type){welcome.style.display='none';let row=document.createElement('div');row.className='message '+type;let b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);messages.appendChild(row);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight}document.getElementById('composer').onsubmit=e=>{e.preventDefault();let text=input.value.trim();if(!text)return;msg(text,'user');input.value='';resize();setTimeout(()=>msg('I’m ready. The AI connection is the next piece we’ll add to this clean chat interface.','assistant'),250)};resize();render()})();</script></body></html>
