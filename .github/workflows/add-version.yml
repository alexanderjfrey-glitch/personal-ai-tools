name: Add app version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[versioned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add visible version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'id="appVersion"' not in s:
              s = s.replace('<div class="date" id="today"></div>', '<div class="date" id="today"></div><div class="date" id="appVersion">Version 0.1.0</div>')
              s = s.replace('.eyebrow,.date,.muted,small{color:#8b95a5}', '.eyebrow,.date,.muted,small{color:#8b95a5}.version{font-size:11px;margin-top:2px;opacity:.8}')
              s = s.replace('id="appVersion">Version 0.1.0', 'id="appVersion" class="version">Version 0.1.0')
              p.write_text(s)
          PY

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add visible app version [versioned]"
          git push

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/add-version.yml
          git add .github/workflows/add-version.yml
          git commit -m "Remove one-time version workflow [versioned]"
          git push
