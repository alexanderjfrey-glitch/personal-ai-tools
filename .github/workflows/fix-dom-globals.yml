name: Fix browser DOM globals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DOM compatibility shim
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = "<script>\nconst KEY='pai_tasks_v1'"
          shim = "<script>\n// Safari/iOS compatibility: expose element IDs used by the legacy UI code.\ndocument.querySelectorAll('[id]').forEach(el => { if (!(el.id in window)) window[el.id] = el; });\n</script>\n<script>\nconst KEY='pai_tasks_v1'"
          if "Safari/iOS compatibility: expose element IDs" not in s:
              if marker not in s:
                  raise SystemExit('Target script marker not found')
              p.write_text(s.replace(marker, shim, 1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile button interactions"
          git push
