name: Fix chat handler
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix chat handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad='''<script src="https://accounts.google.com/gsi/client" async defer>\n\n\nwindow.openTask=openTask;window.closeTask=closeTask;window.saveTask=saveTask;window.completeTask=completeTask;window.show=show;window.sendChat=sendChat;window.connectGoogle=connectGoogle;window.learnLabels=learnLabels;window.analyzeGmail=analyzeGmail;window.openNewLabel=openNewLabel;window.closeNewLabel=closeNewLabel;window.createLabel=createLabel;window.loadDrive=loadDrive;window.filterDrive=filterDrive;\n</script>'''
          good='<script src="https://accounts.google.com/gsi/client" async defer></script>'
          s=s.replace(bad,good)
          s=s.replace('onclick="sendChat()"','onclick="window.sendChat()"')
          s=s.replace("onkeydown=\"if(event.key==='Enter')sendChat()\"", "onkeydown=\"if(event.key==='Enter')window.sendChat()\"")
          marker='render();renderChat();'
          exports='window.openTask=openTask;window.closeTask=closeTask;window.saveTask=saveTask;window.completeTask=completeTask;window.show=show;window.sendChat=sendChat;window.connectGoogle=connectGoogle;window.learnLabels=learnLabels;window.analyzeGmail=analyzeGmail;window.openNewLabel=openNewLabel;window.closeNewLabel=closeNewLabel;window.createLabel=createLabel;window.loadDrive=loadDrive;window.filterDrive=filterDrive;'
          s=s.replace(marker, marker+exports, 1) if exports not in s else s
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix chat handler scope"
          git push