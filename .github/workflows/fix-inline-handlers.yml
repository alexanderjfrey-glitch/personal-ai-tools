name: Fix inline handlers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export UI handlers for mobile Safari
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = 'window.openTask=openTask;'
          if marker not in s:
              exports = "\nwindow.openTask=openTask;window.closeTask=closeTask;window.saveTask=saveTask;window.completeTask=completeTask;window.show=show;window.sendChat=sendChat;window.connectGoogle=connectGoogle;window.learnLabels=learnLabels;window.analyzeGmail=analyzeGmail;window.openNewLabel=openNewLabel;window.closeNewLabel=closeNewLabel;window.createLabel=createLabel;window.loadDrive=loadDrive;window.filterDrive=filterDrive;\n"
              pos = s.rfind('</script>')
              if pos < 0:
                  raise SystemExit('No script tag found')
              s = s[:pos] + exports + s[pos:]
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix mobile inline UI handlers"
          git push
