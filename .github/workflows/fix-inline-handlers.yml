name: Fix inline button handlers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[inline-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          names=['openTask','closeTask','saveTask','completeTask','show','sendChat','connectGoogle','learnLabels','analyzeGmail','openNewLabel','closeNewLabel','createLabel','loadDrive','filterDrive','moveEmail']
          for n in names:
              s=re.sub(r'onclick="'+n+r'\(', 'onclick="window.'+n+'(', s)
              s=re.sub(r'onsubmit="'+n+r'\(', 'onsubmit="window.'+n+'(', s)
              s=re.sub(r'onkeydown="([^\"]*?)'+n+r'\(', r'onkeydown="\1window.'+n+'(', s)
              s=re.sub(r'oninput="'+n+r'\(', 'oninput="window.'+n+'(', s)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix inline button handlers [inline-fix]'
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-inline-handlers.yml
          git add .github/workflows/fix-inline-handlers.yml
          git commit -m 'Remove one-time inline handler fix [inline-fix]'
          git push
