name: Final button repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair button exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          exports = "window.openTask=openTask;window.closeTask=closeTask;window.saveTask=saveTask;window.completeTask=completeTask;window.show=show;window.sendChat=sendChat;window.connectGoogle=connectGoogle;window.learnLabels=learnLabels;window.analyzeGmail=analyzeGmail;window.openNewLabel=openNewLabel;window.closeNewLabel=closeNewLabel;window.createLabel=createLabel;window.loadDrive=loadDrive;window.filterDrive=filterDrive;window.moveEmail=moveEmail;"
          s = s.replace('Version 0.1.0', 'Version 0.1.1')
          s = s.replace('window.moveEmail=moveEmail;window.moveEmail=moveEmail;window.moveEmail=moveEmail;', exports)
          if exports not in s:
              marker = 'try{render();renderChat()}catch(e){console.error(e)}'
              s = s.replace(marker, exports + marker, 1)
          p.write_text(s)
          PY
      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair app button handlers [skip ci]"
          git push
