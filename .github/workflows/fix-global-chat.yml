name: Fix global chat handler
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Remove any prior broken export block from the Google external script.
          bad='window.openTask=openTask;window.closeTask=closeTask;window.saveTask=saveTask;window.completeTask=completeTask;window.show=show;window.sendChat=sendChat;window.connectGoogle=connectGoogle;window.learnLabels=learnLabels;window.analyzeGmail=analyzeGmail;window.openNewLabel=openNewLabel;window.closeNewLabel=closeNewLabel;window.createLabel=createLabel;window.loadDrive=loadDrive;window.filterDrive=filterDrive;'
          s=s.replace(bad,'')
          s=s.replace('<script src="https://accounts.google.com/gsi/client" async defer>\n\n\n</script>','<script src="https://accounts.google.com/gsi/client" async defer></script>')
          s=s.replace('onclick="sendChat()"','onclick="window.sendChat()"')
          s=s.replace("onkeydown=\"if(event.key==='Enter')sendChat()\"", "onkeydown=\"if(event.key==='Enter')window.sendChat()\"")
          # Export from the actual app script, after the function declarations have been parsed.
          marker='render();renderChat();'
          export='window.sendChat=sendChat;'
          if export not in s and marker in s:
              s=s.replace(marker, marker+export, 1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix chat global handler"
          git push
