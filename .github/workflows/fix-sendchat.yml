name: Fix chat handler
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export chat handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='render();renderChat();'
          exports='render();renderChat();window.sendChat=sendChat;'
          if 'window.sendChat=sendChat;' not in s and marker in s:
              s=s.replace(marker,exports,1)
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix mobile chat button"
          git push
